# Pages CMS — Web-Nauka: Nauka: konferencje, projekty i granty, publikacje, sukcesy.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: konferencje
  label: Konferencje
  type: collection
  path: src/content/konferencje
  format: yaml-frontmatter
  filename:
    template: '{year}-{primary}.md'
    field: create
  view:
    fields:
    - tytul
    - poczatek
    - miejsce
    primary: tytul
    sort: poczatek
    order: desc
  fields:
  - name: tytul
    label: Nazwa konferencji
    type: string
    required: true
  - name: tytul_en
    label: 'EN: nazwa (jeśli inna)'
    type: string
  - name: poczatek
    label: Początek
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: koniec
    label: Koniec
    type: date
    options:
      format: yyyy-MM-dd
  - name: miejsce
    label: Miejsce (np. Wrocław, Będlewo)
    type: string
  - name: strona
    label: Strona internetowa konferencji
    type: string
  - name: organizatorzy
    label: Organizatorzy z Instytutu
    type: string
  - name: zaklad
    label: Zakład (opcjonalnie)
    type: select
    options:
      values: &id001
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
  - name: zdjecie
    label: Plakat lub zdjęcie (opcjonalnie)
    type: image
    options:
      path: public/pliki/konferencje
  - name: odwolana
    label: Odwołana
    type: boolean
    default: false
  - name: body
    label: Opis (opcjonalnie)
    type: rich-text
    options:
      format: markdown
      path: public/pliki/konferencje
- name: granty
  label: Projekty i granty
  type: collection
  path: src/content/granty
  format: yaml-frontmatter
  filename:
    template: '{year}-{primary}.md'
    field: create
  view:
    fields:
    - tytul
    - kierownik
    - rok_od
    - rodzaj
    primary: tytul
    sort: rok_od
    order: desc
  fields:
  - name: tytul
    label: Tytuł projektu
    type: string
    required: true
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: kod
    label: Numer (np. 2024/53/N/ST1/02294)
    type: string
  - name: rodzaj
    label: Źródło finansowania
    type: select
    default: ncn
    options:
      values:
      - name: ncn
        label: NCN
      - name: ue
        label: UE i międzynarodowe
      - name: wewnetrzny
        label: Wewnętrzne
      - name: inny
        label: Inne
  - name: program
    label: Program (np. OPUS, SONATA, PRELUDIUM)
    type: string
  - name: kierownik
    label: Kierownik
    type: string
  - name: wykonawcy
    label: Wykonawcy
    type: string
  - name: rok_od
    label: Rok rozpoczęcia
    type: number
  - name: rok_do
    label: Rok zakończenia
    type: number
  - name: kwota
    label: Kwota (opcjonalnie)
    type: string
  - name: zaklad
    label: Zakład (puste = zakład kierownika ze spisu pracowników)
    type: select
    options:
      values: *id001
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
  - name: strona
    label: Strona projektu
    type: string
  - name: body
    label: Opis projektu (opcjonalnie; pokazuje się na podstronie projektu pod danymi)
    type: rich-text
    options:
      format: markdown
- name: publikacje
  label: Publikacje
  description: 'Strona /nauka/publikacje. Nowy rok: dodaj go na górze listy „Lata” i wgraj PDF. Liczby prac liczą się same z wykazów w HTML (Publikacje — wykazy prac).'
  type: file
  path: src/data/publikacje.json
  format: json
  fields:
  - name: wstep
    label: Tekst pod tytułem
    type: text
  - name: wstep_en
    label: 'EN: tekst pod tytułem'
    type: text
  - name: lata
    label: Lata (najnowszy na górze)
    type: object
    list: true
    fields:
    - name: rok
      label: Rok
      type: number
      required: true
    - name: plik
      label: Wykaz (PDF)
      type: file
      options:
        path: public/pliki/nauka/publikacje
    - name: link
      label: Albo link do wykazu (https://…), gdy nie ma PDF
      type: string
    - name: uwagi
      label: Uwaga na karcie roku (opcjonalnie)
      type: string
    - name: uwagi_en
      label: 'EN: uwaga'
      type: string
  - name: czasopisma_naglowek
    label: Nagłówek sekcji czasopism
    type: string
    default: Czasopisma redagowane w Instytucie
  - name: czasopisma_naglowek_en
    label: 'EN: nagłówek sekcji czasopism'
    type: string
  - name: czasopisma
    label: Czasopisma
    type: object
    list: true
    fields:
    - name: nazwa
      label: Nazwa
      type: string
      required: true
    - name: opis
      label: Opis
      type: text
    - name: opis_en
      label: 'EN: opis'
      type: text
    - name: wydawca
      label: Wydawca
      type: string
    - name: wydawca_en
      label: 'EN: wydawca'
      type: string
    - name: wsparcie
      label: Wsparcie (np. współfinansujące wydziały)
      type: string
    - name: wsparcie_en
      label: 'EN: wsparcie'
      type: string
    - name: redakcja
      label: Adres redakcji
      type: string
    - name: redakcja_en
      label: 'EN: adres redakcji'
      type: string
    - name: kontakt
      label: E-mail redakcji
      type: string
    - name: issn
      label: ISSN (druk)
      type: string
    - name: eissn
      label: eISSN (online)
      type: string
    - name: adres
      label: Strona czasopisma (https://…)
      type: string
  - name: archiwum
    label: Uwaga pod czasopismami (np. o dawnych seriach)
    type: text
  - name: archiwum_en
    label: 'EN: uwaga pod czasopismami'
    type: text
- name: publikacje-wykazy
  label: Publikacje — wykazy prac (lista w HTML)
  description: Jeden plik = jeden rok (podstrona /nauka/publikacje/RRRR). Wykaz w HTML jest opcjonalny — wystarczy PDF w „Publikacje”.
  type: collection
  path: src/data/publikacje
  format: json
  filename: '{fields.rok}.json'
  view:
    fields:
    - rok
    primary: rok
    sort: rok
    order: desc
  fields:
  - name: rok
    label: Rok
    type: number
    required: true
  - name: uwagi
    label: Uwaga nad listą (opcjonalnie)
    type: text
  - name: uwagi_en
    label: 'EN: uwaga nad listą'
    type: text
  - name: grupy
    label: Grupy prac (jedna grupa bez nagłówka = zwykła lista)
    type: object
    list: true
    fields:
    - name: naglowek
      label: Nagłówek grupy (np. Artykuły problemowe; puste = bez nagłówka)
      type: string
    - name: naglowek_en
      label: 'EN: nagłówek grupy'
      type: string
    - name: rok_wydania
      label: Rok wydania, jeśli inny niż rok wykazu
      type: number
    - name: prace
      label: Prace
      type: object
      list: true
      fields:
      - name: autorzy
        label: Autorzy
        type: string
      - name: tytul
        label: Tytuł
        type: string
      - name: zrodlo
        label: Czasopismo / wydawnictwo, rok, tom, strony
        type: string
      - name: opis
        label: Opis w jednym polu (gdy tytułu i źródła nie da się rozdzielić)
        type: string
      - name: doi
        label: DOI (np. 10.1016/j.jfa.2025.111082)
        type: string
      - name: if
        label: IF (impact factor, opcjonalnie)
        type: string
      - name: uwagi
        label: Uwagi (np. język
        „w druku”): null
        type: string
- name: strony
  label: Strony działu Nauka
  description: Adres strony = ścieżka pliku, np. studia/matematyka.md → /studia/matematyka
  type: collection
  path: src/content/strony/nauka
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      path: public/pliki/nauka
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: tresc_en
    label: 'EN: treść (Markdown)'
    type: text
