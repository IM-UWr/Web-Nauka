# Pages CMS — Web-Nauka: Nauka: konferencje, projekty i granty, publikacje, sukcesy.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: strona-dzialu
  label: Strona działu Nauka
  description: 'Strona /nauka: tytuł i tekst „Badania w Instytucie” (po polsku i po angielsku), niżej drobne pola — tekst pod tytułem, hasło i „W skrócie”. Liczby, kafelki (z menu „Nauka”), zakłady, konferencje, granty i obrony budują się same z danych.'
  type: file
  path: src/data/nauka.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: body
    label: Treść
    description: |-
      Tekst sekcji „Badania w Instytucie” (pierwszy akapit strona pokazuje większą czcionką).

      Piszesz jak w zwykłym edytorze; akapity oddziela Enter. Nagłówek 2 = nowa sekcja (pojawi się w spisie „Na tej stronie”).

      Kilka układów strona rozpoznaje sama:

      • Punkt listy zaczynający się pogrubieniem = kafelek.

      • Lista numerowana z pogrubionym początkiem = oś kroków.

      • Punkt z rolą kursywą i nazwiskiem pogrubionym = kontakt.

      • Lista samych linków = lista plików (PDF / strona).

      • Nagłówek 3 zakończony znakiem „?” = rozwijane pytanie.

      • Tekst nad listą (Seminaria, Konferencje, Aktualności…): lista stoi pod całym tekstem, chyba że jest kotwica — np. na stronie Publikacje tekst pod nagłówkiem 2 „Czasopisma redagowane w Instytucie” stoi nad listą czasopism.

      • Plik PDF: wgraj w „Media” i wklej link.

      • Akapit zaczynający się od dwuliterowego skrótu z kropką („Np.”, „Dr.”, „No.”) edytor zapisze jako listę numerowaną „1.” — zacznij akapit inaczej albo pogrub skrót.

      Więcej: ściągawka edytora (dok/sciagawka-edytora.md w Web-Core).
    type: rich-text
    options:
      format: markdown
      path: public/pliki/nauka
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: tresc_en
    label: Treść EN
    type: rich-text
    options:
      format: markdown
      path: public/pliki/nauka
    description: Tekst „Badania w Instytucie” po angielsku, w tym samym układzie co Treść. Puste = strona angielska pokaże tekst polski.
  - name: wstep
    label: Wstęp pod tytułem (1–3 zdania)
    type: text
  - name: wstep_en
    label: 'EN: wstęp'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: badania_fakty
    label: Ramka „W skrócie” obok tekstu „Badania w Instytucie” (komputer; puste = bez ramki)
    type: object
    list: true
    fields:
    - name: wartosc
      label: Wartość (krótko, np. A+, 8, 1947)
      type: string
    - name: wartosc_en
      label: 'EN: wartość (puste = jak po polsku, np. liczby i lata)'
      type: string
    - name: opis
      label: Opis pod wartością
      type: string
    - name: opis_en
      label: 'EN: opis'
      type: string
- name: konferencje
  label: Konferencje
  type: collection
  path: src/content/konferencje
  format: yaml-frontmatter
  filename:
    template: '{year}-{primary}.md'
    field: create
  view:
    fields:
    - tytul
    - poczatek
    - miejsce
    primary: tytul
    sort: poczatek
    order: desc
  fields:
  - name: tytul
    label: Nazwa konferencji
    type: string
    required: true
  - name: tytul_en
    label: 'EN: nazwa (jeśli inna)'
    type: string
  - name: poczatek
    label: Początek
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: koniec
    label: Koniec
    type: date
    options:
      format: yyyy-MM-dd
  - name: miejsce
    label: Miejsce (np. Wrocław, Będlewo)
    type: string
  - name: strona
    label: Strona internetowa konferencji
    type: string
  - name: organizatorzy
    label: Organizatorzy z Instytutu
    type: string
  - name: zaklad
    label: Zakład (opcjonalnie)
    type: select
    options:
      values: &id001
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
  - name: zdjecie
    label: Plakat lub zdjęcie (opcjonalnie)
    type: image
    options:
      path: public/pliki/konferencje
  - name: odwolana
    label: Odwołana
    type: boolean
    default: false
  - name: body
    label: Opis (opcjonalnie)
    type: rich-text
    options:
      format: markdown
      path: public/pliki/konferencje
- name: granty
  label: Projekty i granty
  type: collection
  path: src/content/granty
  format: yaml-frontmatter
  filename:
    template: '{year}-{primary}.md'
    field: create
  view:
    fields:
    - tytul
    - kierownik
    - rok_od
    - rodzaj
    primary: tytul
    sort: rok_od
    order: desc
  fields:
  - name: tytul
    label: Tytuł projektu
    type: string
    required: true
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: kod
    label: Numer (np. 2024/53/N/ST1/02294)
    type: string
  - name: rodzaj
    label: Źródło finansowania
    type: select
    default: ncn
    options:
      values:
      - name: ncn
        label: NCN
      - name: ue
        label: UE i międzynarodowe
      - name: wewnetrzny
        label: Wewnętrzne
      - name: inny
        label: Inne
  - name: program
    label: Program (np. OPUS, SONATA, PRELUDIUM)
    type: string
  - name: kierownik
    label: Kierownik
    type: string
  - name: wykonawcy
    label: Wykonawcy
    type: string
  - name: rok_od
    label: Rok rozpoczęcia
    type: number
  - name: rok_do
    label: Rok zakończenia
    type: number
  - name: kwota
    label: Kwota (opcjonalnie)
    type: string
  - name: zaklad
    label: Zakład (puste = zakład kierownika ze spisu pracowników)
    type: select
    options:
      values: *id001
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
  - name: strona
    label: Strona projektu
    type: string
  - name: body
    label: Opis projektu (opcjonalnie; pokazuje się na podstronie projektu pod danymi)
    type: rich-text
    options:
      format: markdown
- name: publikacje
  label: Publikacje
  description: 'Strona /nauka/publikacje. Nowy rok: dodaj go na górze listy „Lata” i wgraj PDF. Liczby prac liczą się same z wykazów w HTML (Publikacje — wykazy prac). Tytuł, opis pod tytułem, hasło i tekst strony (także o czasopismach) — Strony → nauka/publikacje.md.'
  type: file
  path: src/data/publikacje.json
  format: json
  fields:
  - name: lata
    label: Lata (najnowszy na górze)
    type: object
    list: true
    fields:
    - name: rok
      label: Rok
      type: number
      required: true
    - name: plik
      label: Wykaz (PDF)
      type: file
      options:
        path: public/pliki/nauka/publikacje
    - name: link
      label: Albo link do wykazu (https://…), gdy nie ma PDF
      type: string
    - name: uwagi
      label: Uwaga na karcie roku (opcjonalnie)
      type: string
    - name: uwagi_en
      label: 'EN: uwaga'
      type: string
  - name: czasopisma
    label: Czasopisma
    type: object
    list: true
    fields:
    - name: nazwa
      label: Nazwa
      type: string
      required: true
    - name: opis
      label: Opis
      type: text
    - name: opis_en
      label: 'EN: opis'
      type: text
    - name: wydawca
      label: Wydawca
      type: string
    - name: wydawca_en
      label: 'EN: wydawca'
      type: string
    - name: wsparcie
      label: Wsparcie (np. współfinansujące wydziały)
      type: string
    - name: wsparcie_en
      label: 'EN: wsparcie'
      type: string
    - name: redakcja
      label: Adres redakcji
      type: string
    - name: redakcja_en
      label: 'EN: adres redakcji'
      type: string
    - name: kontakt
      label: E-mail redakcji
      type: string
    - name: issn
      label: ISSN (druk)
      type: string
    - name: eissn
      label: eISSN (online)
      type: string
    - name: adres
      label: Strona czasopisma (https://…)
      type: string
  - name: archiwum
    label: Uwaga pod czasopismami (np. o dawnych seriach)
    type: text
  - name: archiwum_en
    label: 'EN: uwaga pod czasopismami'
    type: text
  - name: zrodla
    label: Źródła (techniczne)
    type: string
    list: true
    hidden: true
  - name: do_uzupelnienia
    label: Do uzupełnienia (techniczne)
    type: string
    list: true
    hidden: true
- name: publikacje-wykazy
  label: Publikacje — wykazy prac (lista w HTML)
  description: Jeden plik = jeden rok (podstrona /nauka/publikacje/RRRR). Wykaz w HTML jest opcjonalny — wystarczy PDF w „Publikacje”.
  type: collection
  path: src/data/publikacje
  format: json
  filename: '{fields.rok}.json'
  view:
    fields:
    - rok
    primary: rok
    sort: rok
    order: desc
  fields:
  - name: rok
    label: Rok
    type: number
    required: true
  - name: uwagi
    label: Uwaga nad listą (opcjonalnie)
    type: text
  - name: uwagi_en
    label: 'EN: uwaga nad listą'
    type: text
  - name: pochodzenie
    label: Skąd pochodzi wykaz (zdanie nad listą prac; puste = bez zdania)
    type: select
    options:
      values:
      - name: pdf
        label: Wersja tekstowa wykazu z pliku PDF
      - name: strona
        label: Przeniesiony z poprzedniej strony
  - name: zrodla
    label: Źródła (techniczne)
    type: string
    list: true
    hidden: true
  - name: grupy
    label: Grupy prac (jedna grupa bez nagłówka = zwykła lista)
    type: object
    list: true
    fields:
    - name: naglowek
      label: Nagłówek grupy (np. Artykuły problemowe; puste = bez nagłówka)
      type: string
    - name: naglowek_en
      label: 'EN: nagłówek grupy'
      type: string
    - name: rok_wydania
      label: Rok wydania, jeśli inny niż rok wykazu
      type: number
    - name: prace
      label: Prace
      type: object
      list: true
      fields:
      - name: autorzy
        label: Autorzy
        type: string
      - name: tytul
        label: Tytuł
        type: string
      - name: zrodlo
        label: Czasopismo / wydawnictwo, rok, tom, strony
        type: string
      - name: opis
        label: Opis w jednym polu (gdy tytułu i źródła nie da się rozdzielić)
        type: string
      - name: doi
        label: DOI (np. 10.1016/j.jfa.2025.111082)
        type: string
      - name: if
        label: IF (impact factor, opcjonalnie)
        type: string
      - name: uwagi
        label: Uwagi (np. język
        „w druku”): null
        type: string
- name: strony
  label: Strony działu Nauka
  description: 'Adres strony = ścieżka pliku, np. nauka/sukcesy/historia.md → /nauka/sukcesy/historia (nowe strony działu zakładaj w folderze nauka). Teksty stron z listą (tytuł, opis, hasło i tekst nad listą) to też strony: seminaria.md, nauka/konferencje.md, nauka/granty.md, nauka/sukcesy.md, nauka/publikacje.md. Brak takiej strony nic nie psuje — lista pokaże domyślny tytuł i hasło, bez tekstu.'
  type: collection
  path: src/content/strony
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_podstron
    label: Hasło na banerze stron pojedynczych wpisów (tylko Publikacje — rocznik, i Obrony doktorskie — obrona)
    type: string
  - name: haslo_podstron_en
    label: 'EN: hasło stron pojedynczych wpisów'
    type: string
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list: true
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
    - name: n_en
      label: 'EN: liczba (puste = jak po polsku)'
      type: string
    - name: etykieta
      label: Podpis
      type: string
      required: true
    - name: etykieta_en
      label: 'EN: podpis'
      type: string
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      path: public/pliki/nauka
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: tresc_en
    label: 'EN: treść (Markdown)'
    type: text
