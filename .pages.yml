# Pages CMS — Web-Nauka: Nauka: konferencje, projekty i granty, publikacje, sukcesy.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
# Zlecenie 33: pole „Opublikowane” wróciło w Stronach i na stronie działu (odznaczone = szkic, widoczny tylko na Podglądzie).
# Zlecenie 40: Strony i strona działu w jawnym Markdownie (ukryte format_tresci), ściągawki przy Treści, pola EN pod polskimi, opisy formularzy, szablony Treści konferencji i projektu; konferencja z opisem ma własną stronę.
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: strona-dzialu
  label: Strona działu Nauka
  description: 'Strona /nauka: tytuł i tekst „Badania w Instytucie” (po polsku i po angielsku), niżej drobne pola — opis strony dla Google, hasło i „W skrócie”. Liczby, kafelki (z menu „Nauka”), zakłady, konferencje, granty i obrony budują się same z danych.'
  type: file
  path: src/data/nauka.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    description: |-
      Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). To tekst sekcji „Badania w Instytucie”; pierwszy akapit strona pokazuje większą czcionką.
    type: code
    options:
      format: markdown
  - name: tresc_en
    label: Treść EN
    type: code
    options:
      format: markdown
    description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Tekst „Badania w Instytucie” po angielsku. Puste = strona angielska pokaże tekst polski."
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: wstep
    label: Opis strony dla Google (1–2 zdania)
    description: Trafia do Google i do podglądu linku; na samej stronie się nie wyświetla. Np. „Badania w ośmiu zakładach naukowych Instytutu…”. Puste = ogólny opis serwisu.
    type: text
  - name: wstep_en
    label: 'EN: opis strony dla Google'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    description: Np. „Poznaj nasze badania na A+”. Puste = hasło domyślne działu.
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: badania_fakty
    label: Ramka „W skrócie” obok tekstu „Badania w Instytucie” (komputer; puste = bez ramki)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{wartosc} {opis}"
    fields:
    - name: wartosc
      label: Wartość (krótko, np. A+, 8, 1947)
      type: string
      required: true
    - name: wartosc_en
      label: 'EN: wartość (puste = jak po polsku, np. liczby i lata)'
      type: string
    - name: opis
      label: Opis pod wartością
      type: string
    - name: opis_en
      label: 'EN: opis'
      type: string
    - name: adres
      label: Link (opcjonalnie)
      description: "Strona, do której prowadzi wartość, np. /nauka/granty (wersja angielska sama prowadzi do /en/…). Puste = bez linku."
      type: string
    - name: pozycja
      type: boolean
      hidden: true
- name: konferencje
  label: Konferencje
  description: Konferencje i warsztaty Instytutu. Lista w Nauce → Konferencje (nadchodzące i według lat). Konferencja z opisem ma własną stronę; bez opisu link prowadzi od razu na jej stronę internetową.
  type: collection
  path: src/content/konferencje
  format: yaml-frontmatter
  filename:
    template: '{year}-{primary}.md'
  view:
    fields:
    - tytul
    - poczatek
    - miejsce
    primary: tytul
    sort: [poczatek]
    default:
      sort: poczatek
      order: desc
  fields:
  - name: tytul
    label: Nazwa konferencji
    type: string
    required: true
  - name: tytul_en
    label: 'EN: nazwa (jeśli inna)'
    type: string
  - name: poczatek
    label: Początek
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: koniec
    label: Koniec
    type: date
    default: ""
    options:
      format: yyyy-MM-dd
  - name: miejsce
    label: Miejsce (np. Wrocław, Będlewo)
    type: string
  - name: body
    label: Opis (opcjonalnie; konferencja z opisem ma własną stronę)
    description: "Zwykły Markdown: akapity oddziela pusta linia; **pogrubienie**, *kursywa*, [tekst linku](https://…); lista: „- ” na początku linii; ## = nagłówek sekcji. Plik PDF: wgraj w „Media” i wklej link. Komentarze <!-- … --> to podpowiedzi; na stronie ich nie widać. Pusta Treść (albo sam komentarz) = konferencja bez własnej strony; link prowadzi wtedy na jej stronę internetową."
    type: code
    options:
      format: markdown
    default: |-
      <!-- TEKST: Zwykły tekst. Akapity oddziela pusta linia. Pliki: wgraj w „Media” i wklej link. -->
      <!-- Rejestracja, program, plakat: wstaw link w osobnej linii. -->
      <!-- Program, rejestracja, opłaty: każda informacja w osobnym akapicie. -->
  - name: strona
    label: Strona internetowa konferencji
    type: string
  - name: organizatorzy
    label: Organizatorzy z Instytutu (strona tego pola nie pokazuje; ukryte, dane zostają)
    type: string
    hidden: true
  - name: zaklad
    label: Zakład (opcjonalnie)
    type: select
    options:
      values: &id001
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
  - name: zdjecie
    label: Plakat lub zdjęcie (opcjonalnie)
    type: image
    options:
      path: public/pliki/konferencje
  - name: odwolana
    label: Odwołana
    type: boolean
    default: false
- name: granty
  label: Projekty i granty
  description: Projekty badawcze pracowników. Lista w Nauce → Projekty i granty; każdy projekt ma własną stronę z danymi, opis pokazuje się pod nimi.
  type: collection
  path: src/content/granty
  format: yaml-frontmatter
  filename:
    template: '{year}-{primary}.md'
  view:
    fields:
    - tytul
    - kierownik
    - rok_od
    - rodzaj
    primary: tytul
    sort: rok_od
    order: desc
  fields:
  - name: tytul
    label: Tytuł projektu
    type: string
    required: true
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: rodzaj
    label: Źródło finansowania
    type: select
    default: ncn
    options:
      values:
      - name: ncn
        label: NCN
      - name: ue
        label: UE i międzynarodowe
      - name: wewnetrzny
        label: Wewnętrzne
      - name: inny
        label: Inne
  - name: rok_od
    label: Rok rozpoczęcia
    type: number
  - name: rok_do
    label: Rok zakończenia
    type: number
  - name: body
    label: Opis projektu (opcjonalnie; pokazuje się na podstronie projektu pod danymi)
    description: "Zwykły Markdown: akapity oddziela pusta linia; **pogrubienie**, *kursywa*, [tekst linku](https://…); lista: „- ” na początku linii; ## = nagłówek sekcji. Plik PDF: wgraj w „Media” i wklej link. Komentarze <!-- … --> to podpowiedzi; na stronie ich nie widać. Pusta Treść (albo sam komentarz) = strona projektu pokaże same dane."
    type: code
    options:
      format: markdown
    default: "<!-- OPIS PROJEKTU: Cel i wyniki projektu. Pusta Treść = strona projektu pokaże same dane. -->"
  - name: kod
    label: Numer (np. 2024/53/N/ST1/02294)
    type: string
  - name: program
    label: Program (np. OPUS, SONATA, PRELUDIUM)
    type: string
  - name: kierownik
    label: Kierownik
    type: string
  - name: wykonawcy
    label: Wykonawcy
    type: string
  - name: kwota
    label: Kwota (opcjonalnie)
    type: string
  - name: zaklad
    label: Zakład (puste = zakład kierownika ze spisu pracowników)
    type: select
    options:
      values: *id001
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
  - name: strona
    label: Strona projektu
    type: string
- name: publikacje
  label: Publikacje
  description: 'Strona /nauka/publikacje. Nowy rok: dodaj go na górze listy „Lata” i wgraj PDF. Liczby prac liczą się same z wykazów w HTML (Publikacje — wykazy prac). Tytuł, opis pod tytułem, hasło i tekst strony (także o czasopismach) — Strony → nauka/publikacje.md.'
  type: file
  path: src/data/publikacje.json
  format: json
  fields:
  - name: lata
    label: Lata (najnowszy na górze)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{rok}"
    fields:
    - name: rok
      label: Rok
      type: number
      required: true
    - name: plik
      label: Wykaz (PDF)
      type: file
      options:
        path: public/pliki/nauka/publikacje
    - name: link
      label: Albo link do wykazu (https://…), gdy nie ma PDF
      type: string
    - name: uwagi
      label: Uwaga na karcie roku (opcjonalnie)
      type: string
    - name: uwagi_en
      label: 'EN: uwaga'
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: czasopisma
    label: Czasopisma
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{nazwa}"
    fields:
    - name: nazwa
      label: Nazwa
      type: string
      required: true
    - name: opis
      label: Opis
      type: text
    - name: opis_en
      label: 'EN: opis'
      type: text
    - name: wydawca
      label: Wydawca
      type: string
    - name: wydawca_en
      label: 'EN: wydawca'
      type: string
    - name: wsparcie
      label: Wsparcie (np. współfinansujące wydziały)
      type: string
    - name: wsparcie_en
      label: 'EN: wsparcie'
      type: string
    - name: redakcja
      label: Adres redakcji
      type: string
    - name: redakcja_en
      label: 'EN: adres redakcji'
      type: string
    - name: kontakt
      label: E-mail redakcji
      type: string
    - name: issn
      label: ISSN (druk)
      type: string
    - name: eissn
      label: eISSN (online)
      type: string
    - name: adres
      label: Strona czasopisma (https://…)
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: archiwum
    label: Uwaga pod czasopismami (np. o dawnych seriach)
    type: text
  - name: archiwum_en
    label: 'EN: uwaga pod czasopismami'
    type: text
  - name: zrodla
    label: Źródła (techniczne)
    type: string
    list: true
    hidden: true
  - name: do_uzupelnienia
    label: Do uzupełnienia (techniczne)
    type: string
    list: true
    hidden: true
- name: publikacje-wykazy
  label: Publikacje — wykazy prac (lista w HTML)
  description: Jeden plik = jeden rok (podstrona /nauka/publikacje/RRRR). Wykaz w HTML jest opcjonalny — wystarczy PDF w „Publikacje”.
  type: collection
  path: src/data/publikacje
  format: json
  filename: '{fields.rok}.json'
  view:
    fields:
    - rok
    primary: rok
    sort: rok
    order: desc
  fields:
  - name: rok
    label: Rok
    type: number
    required: true
  - name: uwagi
    label: Uwaga nad listą (opcjonalnie)
    type: text
  - name: uwagi_en
    label: 'EN: uwaga nad listą'
    type: text
  - name: pochodzenie
    label: Skąd pochodzi wykaz (zdanie nad listą prac; puste = bez zdania)
    type: select
    options:
      values:
      - name: pdf
        label: Wersja tekstowa wykazu z pliku PDF
      - name: strona
        label: Przeniesiony z poprzedniej strony
  - name: zrodla
    label: Źródła (techniczne)
    type: string
    list: true
    hidden: true
  - name: grupy
    label: Grupy prac (jedna grupa bez nagłówka = zwykła lista)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {naglowek}"
    fields:
    - name: naglowek
      label: Nagłówek grupy (np. Artykuły problemowe; puste = bez nagłówka)
      type: string
    - name: naglowek_en
      label: 'EN: nagłówek grupy'
      type: string
    - name: rok_wydania
      label: Rok wydania, jeśli inny niż rok wykazu
      type: number
    - name: prace
      label: Prace
      type: object
      list:
        collapsible:
          collapsed: true
          summary: "{autorzy}: {tytul}{opis}"
      fields:
      - name: autorzy
        label: Autorzy
        type: string
      - name: tytul
        label: Tytuł
        type: string
      - name: zrodlo
        label: Czasopismo / wydawnictwo, rok, tom, strony
        type: string
      - name: opis
        label: Opis w jednym polu (gdy tytułu i źródła nie da się rozdzielić)
        type: string
      - name: doi
        label: DOI (np. 10.1016/j.jfa.2025.111082)
        type: string
      - name: if
        label: IF (impact factor, opcjonalnie)
        type: string
      - name: uwagi
        label: Uwagi (np. język
        „w druku”): null
        type: string
- name: strony
  label: Strony działu Nauka
  description: 'Adres strony = ścieżka pliku, np. nauka/sukcesy/historia.md → /nauka/sukcesy/historia (nowe strony działu zakładaj w folderze nauka). Teksty stron z listą (tytuł, opis, hasło i tekst nad listą) to też strony: seminaria.md, nauka/konferencje.md, nauka/granty.md, nauka/sukcesy.md, nauka/publikacje.md. Brak takiej strony nic nie psuje — lista pokaże domyślny tytuł i hasło, bez tekstu. Treść w jawnym Markdownie, jak w Studiach.'
  type: collection
  path: src/content/strony
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    type: code
    options:
      format: markdown
    description: |-
      Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Strona z listą (Konferencje, Projekty i granty, Sukcesy, Publikacje): tekst stoi nad listą. Na stronie Publikacje część pod „## Czasopisma redagowane w Instytucie {#czasopisma}” stoi nad listą czasopism (bez tego nagłówka czasopisma są bez tekstu).
  - name: tresc_en
    label: Treść EN
    description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Puste = strona angielska pokaże treść polską. Na stronie Publikacje tekst nad czasopismami pod nagłówkiem z {#czasopisma}."
    type: code
    options:
      format: markdown
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: opis
    label: Krótki opis (Google i podgląd linku)
    description: Na samej stronie się nie wyświetla (baner pokazuje tytuł i hasło). Np. „Wykazy publikacji pracowników Instytutu według roku wydania…”. Puste = opis domyślny.
    type: text
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: haslo_podstron
    label: Hasło na banerze stron pojedynczych wpisów (tylko Publikacje — rocznik, i Obrony doktorskie — obrona)
    type: string
  - name: haslo_podstron_en
    label: 'EN: hasło stron pojedynczych wpisów'
    type: string
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{n} {etykieta}"
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
    - name: n_en
      label: 'EN: liczba (puste = jak po polsku)'
      type: string
    - name: etykieta
      label: Podpis
      type: string
      required: true
    - name: etykieta_en
      label: 'EN: podpis'
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włączone: listy w treści stają się blokami (kafelki, oś kroków, kontakty, lista plików, rozwijane pytania) — opis przy polu „Treść”. Wyłączone: zwykłe listy.'
    hidden: true
